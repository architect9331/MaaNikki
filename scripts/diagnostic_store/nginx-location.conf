# Include only in the HTTPS server. Uploads are anonymous; reads require operator login.
location = /maanikki-diagnostics/upload {
    limit_except POST { deny all; }
    limit_req zone=nikki_diagnostics_ip burst=12 nodelay;
    limit_req zone=nikki_diagnostics_total burst=30 nodelay;
    limit_req_status 429;
    limit_conn nikki_diagnostics_conn 2;
    client_max_body_size 5m;
    client_body_timeout 20s;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:9340/upload;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_connect_timeout 3s;
    proxy_send_timeout 25s;
    proxy_read_timeout 25s;
    add_header Cache-Control "no-store" always;
}

location ~ '^/maanikki-diagnostics/files/([a-f0-9]{64})\.zip$' {
    limit_except GET { deny all; }
    auth_basic "MaaNikki diagnostic screenshots";
    auth_basic_user_file /etc/nginx/maanikki-diagnostics.htpasswd;
    alias /srv/maanikki-diagnostics/$1.zip;
    default_type application/zip;
    add_header Content-Disposition 'attachment; filename="maanikki-screenshots.zip"' always;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

location /maanikki-diagnostics/ { return 404; }
