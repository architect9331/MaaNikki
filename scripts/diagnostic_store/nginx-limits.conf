# Install in /etc/nginx/conf.d/ (http context).
# Uses nginx's actual peer address; do not trust a client-supplied forwarding header.
limit_req_zone $binary_remote_addr zone=nikki_diagnostics_ip:10m rate=12r/m;
limit_req_zone $server_name zone=nikki_diagnostics_total:1m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=nikki_diagnostics_conn:10m;
