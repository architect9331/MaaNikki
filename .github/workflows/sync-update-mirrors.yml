name: Sync update mirrors

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-mirrors
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Read mirror configuration
        id: config
        run: |
          python - <<'PY'
          import json, os
          config = json.load(open('build/update-mirrors.json'))
          enabled = bool(config['sourceforge_project'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'enabled={str(enabled).lower()}\n')
          PY
      - name: Configure SourceForge SSH
        if: steps.config.outputs.enabled == 'true'
        env:
          SF_KEY: ${{ secrets.SOURCEFORGE_SSH_KEY }}
          SF_HOSTS: ${{ secrets.SOURCEFORGE_KNOWN_HOSTS }}
        run: |
          test -n "$SF_KEY" && test -n "$SF_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SF_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SF_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload release and publish version index
        if: steps.config.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCEFORGE_USERNAME: ${{ vars.SOURCEFORGE_USERNAME }}
        run: python scripts/sync_update_mirrors.py sourceforge
