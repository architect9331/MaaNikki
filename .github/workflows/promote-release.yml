name: Promote release

# New builds publish as prereleases for the beta channel. Promoting one moves the
# same files to the stable channel, with no rebuild.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published prerelease tag, such as v1.0.0
        required: true

permissions:
  contents: write
  actions: write

jobs:
  promote:
    if: ${{ github.repository_owner == 'architect9331' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Mark the release as stable
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
      - name: Update stable distribution
        run: |
          gh workflow run --repo "$GITHUB_REPOSITORY" mirrorchyan_release.yml -f "tag=$TAG"
          gh workflow run --repo "$GITHUB_REPOSITORY" mirrorchyan_release_note.yml -f "tag=$TAG"
          gh workflow run --repo "$GITHUB_REPOSITORY" sync-update-mirrors.yml -f "tag=$TAG"
          gh workflow run --repo "$GITHUB_REPOSITORY" sync-website.yml
