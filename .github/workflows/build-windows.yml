name: Build Windows x64

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup show
      - name: Build and verify release packages
        shell: pwsh
        run: ./scripts/build.ps1 -Action Package
      - name: Upload npm diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MaaNikki-build-npm-logs
          path: .build/npm-cache/_logs/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: MaaNikki-Windows-x64
          path: artifacts/*
          if-no-files-found: error

  publish:
    needs: build
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    concurrency:
      group: publish-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@v4
        with:
          name: MaaNikki-Windows-x64
          path: artifacts
      - name: Publish a new project version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py
      - name: Trigger MirrorChyanUploading
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python -c 'import json; print("v" + json.load(open("interface.json", encoding="utf-8-sig"))["version"])')
          gh workflow run --repo "$GITHUB_REPOSITORY" mirrorchyan_release.yml -f "tag=$tag"
          gh workflow run --repo "$GITHUB_REPOSITORY" mirrorchyan_release_note.yml -f "tag=$tag"

  mirrors:
    needs: publish
    uses: ./.github/workflows/sync-update-mirrors.yml
    secrets: inherit
