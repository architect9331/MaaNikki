name: Build Windows x64

on:
  schedule:
    # Daily patch release check at 03:00 Beijing Time (19:00 UTC).
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Target version (e.g. 0.10.0) or bump rule (patch / minor / major). Leave blank to auto-detect.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      should_build: ${{ steps.prepare.outputs.should_build }}
      sha: ${{ steps.prepare.outputs.sha }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Prepare release version and changelog
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version || '' }}
        run: python scripts/publish_release.py prepare

  build:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup show
      - name: Build and verify release packages
        shell: pwsh
        run: ./scripts/build.ps1 -Action Package
      - name: Upload npm diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MaaNikki-build-npm-logs
          path: .build/npm-cache/_logs/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: MaaNikki-Windows-x64
          path: artifacts/*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    if: >-
      needs.prepare.outputs.should_build == 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@v4
        with:
          name: MaaNikki-Windows-x64
          path: artifacts
      - name: Publish a new project version
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: python scripts/publish_release.py publish
      - name: Trigger MirrorChyanUploading
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python -c 'import json; print("v" + json.load(open("interface.json", encoding="utf-8-sig"))["version"])')
          gh workflow run --repo "$GITHUB_REPOSITORY" mirrorchyan_release.yml -f "tag=$tag"
          gh workflow run --repo "$GITHUB_REPOSITORY" mirrorchyan_release_note.yml -f "tag=$tag"

  mirrors:
    needs: [prepare, publish]
    if: needs.prepare.outputs.should_build == 'true'
    uses: ./.github/workflows/sync-update-mirrors.yml
    secrets: inherit
